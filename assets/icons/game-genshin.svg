<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!--
    原神 · 风格化图标（原创）
    思路：不画风之翼的美术，只取「一对展开的羽翼 + 中央的风」这个抽象构图。
    两片弧形羽翼从中心向两侧上扬，中间一道细竖线代表风。
    配色取自 tokens.py 里 genshin 的金色。
  -->
  <defs>
    <linearGradient id="gi-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0A030"/>
      <stop offset="100%" stop-color="#C4841E"/>
    </linearGradient>
    <linearGradient id="gi-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="96" height="96" rx="22" fill="url(#gi-bg)"/>
  <rect width="96" height="96" rx="22" fill="url(#gi-shine)"/>

  <!-- 左翼：从中心向上外扬的弧带 -->
  <path d="M46 62 C 36 60, 24 50, 22 34 C 34 40, 43 48, 47 57 Z"
        fill="#FFF7E6"/>
  <!-- 右翼：镜像 -->
  <path d="M50 62 C 60 60, 72 50, 74 34 C 62 40, 53 48, 49 57 Z"
        fill="#FFF7E6"/>

  <!-- 中央的风：一道细竖线，两端略收 -->
  <line x1="48" y1="30" x2="48" y2="64" stroke="#FFF7E6" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>
  <!-- 底部一点，像风的落点 -->
  <circle cx="48" cy="69" r="3.2" fill="#FFF7E6"/>
</svg>
