<!doctype html>
<html><head><meta charset="utf-8">
<style>
body{background:#0f1720;margin:0;padding:40px;font-family:system-ui;}
.row{display:flex;gap:32px;align-items:flex-end;flex-wrap:wrap;margin-bottom:36px}
.item{text-align:center;color:#8b98a8;font-size:13px}
img{display:block;margin-bottom:8px}
.small img{width:48px;height:48px}
.mid img{width:96px;height:96px}
.big img{width:192px;height:192px}
h3{color:#e6edf3;font-size:15px;margin:0 0 16px}
</style></head><body>
<h3>应用图标（192 / 96 / 48）</h3>
<div class="row">
  <div class="item big"><img src="./app-icon.svg">192px</div>
  <div class="item mid"><img src="./app-icon.svg">96px</div>
  <div class="item small"><img src="./app-icon.svg">48px</div>
  <div class="item" style="width:40px"><img src="./app-icon.svg" style="width:28px;height:28px">28px</div>
</div>
<h3>三个游戏图标（底栏尺寸 48 / 32 / 24）</h3>
<div class="row">
  <div class="item mid"><img src="./game-arknights.svg">方舟 96</div>
  <div class="item mid"><img src="./game-genshin.svg">原神 96</div>
  <div class="item mid"><img src="./game-starrail.svg">星铁 96</div>
</div>
<div class="row">
  <div class="item small"><img src="./game-arknights.svg">48</div>
  <div class="item small"><img src="./game-genshin.svg">48</div>
  <div class="item small"><img src="./game-starrail.svg">48</div>
  <div class="item" style="width:38px"><img src="./game-arknights.svg" style="width:32px;height:32px">32</div>
  <div class="item" style="width:38px"><img src="./game-genshin.svg" style="width:32px;height:32px">32</div>
  <div class="item" style="width:38px"><img src="./game-starrail.svg" style="width:32px;height:32px">32</div>
  <div class="item" style="width:30px"><img src="./game-arknights.svg" style="width:24px;height:24px">24</div>
  <div class="item" style="width:30px"><img src="./game-genshin.svg" style="width:24px;height:24px">24</div>
  <div class="item" style="width:30px"><img src="./game-starrail.svg" style="width:24px;height:24px">24</div>
</div>
</body></html>
